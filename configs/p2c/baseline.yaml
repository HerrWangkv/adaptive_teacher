_BASE_: "../Base-RCNN-C4.yaml"
MODEL:
  META_ARCHITECTURE: "TargetedAttackedGeneralizedRCNN"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  PROPOSAL_GENERATOR:
    NAME: "FgPseudoRPN"
  ROI_HEADS:
    NAME: "FgPseudoROIHeads"
    NUM_CLASSES: 20
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
SOLVER:
  STEPS: (40000,)
  MAX_ITER: 40000
  IMG_PER_BATCH_LABEL: 16
  IMG_PER_BATCH_UNLABEL: 16
  BASE_LR: 0.01
  WARMUP_ITERS: 500
  CHECKPOINT_PERIOD: 2000
DATASETS:
  CROSS_DATASET: True
  TRAIN_LABEL: ("voc_trainval",)
  TRAIN_UNLABEL: ("Clipart1k_train",)
  TEST: ("Clipart1k_test",)
SEMISUPNET:
  Trainer: "tateacher"
  BBOX_THRESHOLD: 0.9
  TEACHER_UPDATE_ITER: 1
  BURN_UP_STEP: 20000
  EMA_KEEP_RATE: 0.9996
  UNSUP_LOSS_WEIGHT: 1.0
  SUP_LOSS_WEIGHT: 1.0
  DIS_TYPE: "res4" #["concate","p2","multi"]
  PSEUDO_LABEL_REG: False
TEST:
  EVAL_PERIOD: 500
INPUT:
  FORMAT: "RGB"